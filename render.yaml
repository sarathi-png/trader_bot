# Render Blueprint — Quotex Signal Bot Free Tier
# This file configures the bot as a Render Web Service on the Free plan.
# Deploy via: render.com → New Service → Import from Git → select this repo.
# After import, set the env vars in the Render dashboard (see .env.example below).

services:
- type: web
  name: quotex-signal-bot
  env: python
  plan: free
  buildCommand: >
    docker build -t quotex-render -f Dockerfile.render .
  startCommand: python run.py
  # The healthcheck below uses the /status endpoint we added to main.py.
  # Render Free tier puts containers to sleep after 15 min idle;
  # the healthcheck pings every 5 min to keep the container alive.
  healthCheckPath: /status
  healthCheckTimeout: 10
  healthCheckInterval: 300
  healthCheckAttempts: 3
  autoDeploy: true

# Optional: env var defaults (set these in the Render dashboard UI too,
# or via a .env file tracked in the repo).
# Render will surface these as ${VAR_NAME} if you reference them in docker run.
envVars:
  QUOTEX_DEMO: "true"                      # mock mode (recommended Free tier)
  TELEGRAM_BOT_TOKEN: ""                   # ← set in Dashboard → Environment
  TELEGRAM_ALLOWED_USERS: "5482986556"     # your Telegram user ID
  MIN_CONFIDENCE: "50"
  MIN_PAYOUT: "80"
  MAX_SIGNALS_PER_DAY: "15"
  BLOCKED_HOURS: "1,11,17,20"
  LOG_LEVEL: "INFO"